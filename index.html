<title>متغيرات محافظة القاهرة</title>

<style>
body {
  margin: 0;
  padding: 2rem 1.5rem;
  font-family: Arial, sans-serif;
  background-color: #f9fafb;
  color: #111827;
  direction: rtl; /* لضبط اتجاه الموقع كاملاً للعربية */
  text-align: right;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}

/* 🔹 الهيدر */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.logo {
  width: 70px;
  height: auto;
}

/* 🔹 تعديل العنوان */
h1 {
  font-size: 3rem;      /* أكبر */
  font-weight: 800;     /* تخين */
  margin: 0 0 2rem 0;
  line-height: 1.2;
}

.buttons-grid {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.btn {
  padding: 1.2rem 2rem;
  font-size: 2rem;
  font-weight: 700;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: all 0.3s ease;
  text-align: center;
}

.btn-primary {
  background-color: #2563eb;
  color: white;
}

.btn-primary:hover {
  background-color: #1d4ed8;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}

.btn-secondary {
  background-color: #7c3aed;
  color: white;
}

.btn-secondary:hover {
  background-color: #6d28d9;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
}

.btn-tertiary {
  background-color: #059669;
  color: white;
}

.btn-tertiary:hover {
  background-color: #047857;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
}

@media (max-width: 600px) {
  h1 {
    font-size: 2.2rem;
  }

  .logo {
    width: 50px;
  }

  .btn {
    padding: 1rem 1.5rem;
    font-size: 1.5rem; /* تعديل الحجم ليناسب الشاشات الصغيرة بدلاً من 0.95rem ليظل واضحاً */
  }
}
</style>
